[package]
name = "paperlens-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.20"
thiserror = "2.0"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
pdf-extract = "0.8"
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
